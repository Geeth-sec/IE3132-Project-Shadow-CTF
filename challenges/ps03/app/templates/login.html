<!DOCTYPE html>
<html>
<head>
    <title>Project Shadow Developer Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #e5e7eb;
            max-width: 700px;
            margin: 80px auto;
        }

        .box {
            background: #1f2937;
            padding: 30px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Project Shadow</h1>
    <h2>Developer Portal</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Access Phrase</label>
        <input type="password" name="access_phrase" required>

        <button type="submit">Sign In</button>
    </form>
</div>

</body>
</html>
